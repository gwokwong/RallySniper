<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- 三根递增阳线（影线 + 实体） -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95">
    <line x1="160" y1="300" x2="160" y2="392"/>
    <line x1="256" y1="244" x2="256" y2="392"/>
    <line x1="352" y1="176" x2="352" y2="392"/>
  </g>
  <g fill="url(#bar)">
    <rect x="138" y="330" width="44" height="62" rx="6"/>
    <rect x="234" y="286" width="44" height="106" rx="6"/>
    <rect x="330" y="226" width="44" height="166" rx="6"/>
  </g>

  <!-- 上升箭头（主升浪） -->
  <path d="M112 326 L214 268 L292 300 L424 150"
        fill="none" stroke="#ffd54f" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M424 150 L368 158 L414 204 Z" fill="#ffd54f"/>
</svg>
